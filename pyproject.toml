[project]
name = "cnn-signal-sensitivity"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Mahdi Moghaddami", email = "moghaddami@oakland.edu" }
]
requires-python = ">=3.15"
dependencies = [
    "torch>=2.15.0",
    "torchvision>=0.29.2",
]

[project.scripts]
cnn-signal-sensitivity = "cnn_signal_sensitivity:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cu132", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
  { index = "pytorch-cu132", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
]
